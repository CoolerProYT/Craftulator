plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'fabric-loom' version '1.9-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev.legacyforge' version '2.0.84' apply false
    id "me.modmuss50.mod-publish-plugin" version "2.2.0" apply false
}

tasks.register('publishMods') {
    dependsOn ':forge:publishMods', ':fabric:publishMods'
}
